<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gymbuddy</title>
  <meta name="description" content="Persönliches Fitnesstagebuch für Training, Ernährung und Körperwerte. Alle Daten bleiben auf dem Gerät.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gymbuddy">
  <meta name="theme-color" content="#f3f2ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101213" media="(prefers-color-scheme: dark)">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <style>
/* Gymbuddy: ruhige, funktionale Oberfläche im Stil einer iPhone App */

:root {
  --bg: #f3f2ee;
  --surface: #ffffff;
  --surface-2: #f7f6f3;
  --text: #1a1c1e;
  --muted: #6c7074;
  --line: #e4e2dc;
  --track: #ebe9e3;
  --accent: #2c6e5c;
  --accent-ink: #ffffff;
  --accent-soft: #e2eee9;
  --good: #2c7a55;
  --warn: #b7791f;
  --bad: #b53b3b;
  --info: #3d6f9e;
  --c-rad: #2f6fa3;
  --c-lauf: #c4622c;
  --c-kraft: #7559a8;
  --c-schwimmen: #2697ad;
  --c-wandern: #6b8f35;
  --c-ski: #5d7fc0;
  --c-sonst: #8b9096;
  --c-hr: #c8473f;
  --c-hrv: #3d8a7a;
  --c-pwr: #7559a8;
  --c-spd: #2f6fa3;
  --c-alt: #8a7a5a;
  --c-atl: #c4622c;
  --c-sleep: #5a62b0;
  --m-p: #3c78b5;
  --m-c: #cf9a2b;
  --m-f: #a3577f;
  --z1: #9bb8c9; --z2: #4f9a7c; --z3: #d9b13b; --z4: #dd7b30; --z5: #c8473f; --z6: #8e2f5c; --z7: #5b2a7a; --zss: #e39a2f;
  --radius: 16px;
  --radius-s: 10px;
  --shadow: 0 1px 2px rgba(20, 20, 20, .04), 0 2px 10px rgba(20, 20, 20, .04);
  --top: env(safe-area-inset-top, 0px);
  --bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101213;
    --surface: #1a1d1f;
    --surface-2: #222628;
    --text: #eceeed;
    --muted: #9aa1a5;
    --line: #2c3134;
    --track: #2c3134;
    --accent: #5fb49b;
    --accent-ink: #0d1f19;
    --accent-soft: #1d3530;
    --good: #5fb48a;
    --warn: #e0a548;
    --bad: #e06a63;
    --info: #74a6d6;
    --c-rad: #5d9bd1; --c-lauf: #e58a55; --c-kraft: #a28ad6; --c-schwimmen: #4fbfd4; --c-wandern: #95ba5c; --c-ski: #8aa6e0; --c-sonst: #9ba1a7;
    --c-hr: #e66b62; --c-hrv: #63b8a6; --c-pwr: #a28ad6; --c-spd: #5d9bd1; --c-alt: #b3a27e; --c-atl: #e58a55; --c-sleep: #8e95e0;
    --m-p: #6aa5e0; --m-c: #e3b54d; --m-f: #cf86ad;
    --z7: #9a62c4; --zss: #f0ad4e;
    --shadow: none;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  min-height: 100vh;
  padding-bottom: calc(76px + var(--bottom));
  overscroll-behavior-y: none;
}
body.noscroll { overflow: hidden; }
a { color: var(--accent); text-decoration: none; }
h1, h2, h3, h4 { margin: 0; font-weight: 650; letter-spacing: -0.01em; }
p { margin: 0 0 8px; }
p:last-child { margin-bottom: 0; }
svg { display: block; }
.muted { color: var(--muted); }
.small, small { font-size: 13px; }
.tabular { font-variant-numeric: tabular-nums; }
.pad { padding: 8px 0; }
[hidden] { display: none !important; }

/* Kopfleiste */
.topbar {
  position: sticky; top: 0; z-index: 20;
  padding-top: var(--top);
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: saturate(1.6) blur(16px);
  -webkit-backdrop-filter: saturate(1.6) blur(16px);
  border-bottom: 0.5px solid color-mix(in srgb, var(--line) 70%, transparent);
}
.topbar-inner { max-width: 720px; margin: 0 auto; height: 50px; display: flex; align-items: center; gap: 6px; padding: 0 10px 0 16px; }
.topbar h1 { font-size: 19px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#back { margin-left: -8px; }
#actions { display: flex; gap: 2px; }
.icon-btn {
  display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 12px;
  background: none; border: 0; color: var(--text); cursor: pointer; padding: 0;
}
.icon-btn svg { width: 22px; height: 22px; }
.icon-btn:active { background: var(--track); }
.icon-btn.disabled { opacity: .3; pointer-events: none; }

/* Inhalt */
.view { max-width: 720px; margin: 0 auto; padding: 14px 14px 24px; display: flex; flex-direction: column; gap: 12px; }

/* Tableiste */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: flex; justify-content: space-around;
  padding: 6px 4px calc(6px + var(--bottom));
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: saturate(1.6) blur(18px);
  -webkit-backdrop-filter: saturate(1.6) blur(18px);
  border-top: 0.5px solid var(--line);
}
.tabbar a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--muted); font-size: 11px; font-weight: 550; padding: 4px 0; }
.tabbar a svg { width: 25px; height: 25px; }
.tabbar a.on { color: var(--accent); }

/* Karten */
.card { background: var(--surface); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.card-head h3 { font-size: 16px; }
.card-head h3 .muted { font-weight: 450; font-size: 14px; }
.card-link { color: var(--accent); display: inline-flex; align-items: center; gap: 2px; font-size: 14px; font-weight: 550; white-space: nowrap; }
.card-link svg { width: 15px; height: 15px; }
.accent-card { background: var(--accent-soft); box-shadow: none; }
.welcome h3 { font-size: 18px; margin-bottom: 6px; }
.welcome p { color: var(--text); opacity: .85; }
.welcome .btn { margin-top: 6px; }
.hello { padding: 2px 2px 0; }
.hello h2 { font-size: 26px; letter-spacing: -0.02em; }
.hello p { margin: 0; font-size: 14px; }

.banner { display: flex; align-items: center; gap: 12px; background: var(--accent); color: var(--accent-ink); padding: 12px 14px; border-radius: var(--radius); }
.banner > svg { width: 24px; height: 24px; flex: none; }
.banner span { flex: 1; line-height: 1.3; }
.banner small { opacity: .85; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 44px; padding: 0 14px; border-radius: 12px;
  background: var(--surface-2); color: var(--text); border: 0.5px solid var(--line);
  font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; text-align: center;
}
.btn svg { width: 18px; height: 18px; flex: none; }
.btn:active { filter: brightness(.95); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.danger { background: var(--bad); color: #fff; border-color: transparent; }
.btn.danger-text, .danger-text { color: var(--bad); }
.btn.block { width: 100%; }
.btn.small { min-height: 34px; font-size: 14px; }
.btn:disabled { opacity: .4; }
.btn-row { display: flex; gap: 8px; margin-top: 12px; }
.btn-row > * { flex: 1; }
.btn-row.three .btn { padding: 0 6px; font-size: 14px; }
.btn-col { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
.link { background: none; border: 0; color: var(--accent); font: inherit; font-size: 13px; padding: 0; cursor: pointer; font-weight: 600; }
.as-btn { background: none; border: 0; font: inherit; color: inherit; text-align: left; padding: 0; cursor: pointer; }
.more-link { display: block; text-align: center; font-size: 14px; font-weight: 600; padding: 8px 0 0; }

/* Listen */
.list { display: flex; flex-direction: column; }
.row {
  display: flex; align-items: center; gap: 12px; padding: 11px 0;
  border: 0; border-bottom: 0.5px solid var(--line); background: none; color: inherit; font: inherit; text-align: left; width: 100%; cursor: pointer;
}
.list > .row:last-child { border-bottom: 0; }
.row-main { flex: 1; min-width: 0; }
.row-title { font-weight: 560; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-sub { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-end { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.15; }
.row-end span { font-weight: 650; }
.row-end small { color: var(--muted); font-size: 11px; }
.row-plus { color: var(--accent); }
.row-plus svg { width: 20px; height: 20px; }
.sport-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.list-head { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; margin: 16px 0 4px; }
.list-head:first-child { margin-top: 4px; }

/* Ernährung */
.nutri-top { display: flex; align-items: center; gap: 18px; }
.ring-wrap { position: relative; width: 120px; height: 120px; flex: none; }
.ring-label { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; line-height: 1.1; }
.ring-label b { font-size: 24px; letter-spacing: -0.02em; }
.ring-label small { color: var(--muted); font-size: 12px; }
.nutri-side { flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.kv { display: flex; justify-content: space-between; gap: 8px; }
.kv.small { font-size: 13px; color: var(--muted); }
.formula { margin-top: 4px; line-height: 1.35; }
.macros { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
.macro-top { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 4px; }
.macro-top small { color: var(--muted); }
.bar { height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 4px; background: var(--accent); transition: width .3s; }
.bar i.over { background: var(--warn) !important; }
.m-p .bar i { background: var(--m-p); }
.m-c .bar i { background: var(--m-c); }
.m-f .bar i { background: var(--m-f); }

.datenav { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.datelabel { position: relative; font-weight: 650; font-size: 17px; padding: 6px 10px; border-radius: 10px; }
.datelabel input { position: absolute; inset: 0; opacity: 0; width: 100%; }
.meal .card-head { margin-bottom: 4px; }
.add-line { display: flex; align-items: center; gap: 6px; background: none; border: 0; color: var(--accent); font: inherit; font-weight: 600; font-size: 15px; padding: 10px 0 2px; cursor: pointer; }
.add-line svg { width: 18px; height: 18px; }

.search-box { display: flex; align-items: center; gap: 8px; background: var(--surface-2); border: 0.5px solid var(--line); border-radius: 12px; padding: 0 12px; }
.search-box svg { width: 18px; height: 18px; color: var(--muted); flex: none; }
.search-box input { border: 0; background: none; padding: 12px 0; flex: 1; min-width: 0; }
.search-box input:focus { outline: none; box-shadow: none; }
.quick-actions, .chips-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 4px; }
.chips-scroll { display: flex; gap: 6px; overflow-x: auto; padding: 10px 0 6px; scrollbar-width: none; }
.chips-scroll::-webkit-scrollbar { display: none; }
.chip-btn { border: 0.5px solid var(--line); background: var(--surface); color: var(--text); font: inherit; font-size: 14px; font-weight: 550; padding: 7px 12px; border-radius: 999px; white-space: nowrap; cursor: pointer; }
.chip-btn.on { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.amount-row { margin: 10px 0 4px; }
.big-input { font-size: 28px !important; font-weight: 650; text-align: center; }
.calc { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 12px 0; text-align: center; background: var(--surface-2); border-radius: 12px; padding: 10px 4px; }
.calc b { display: block; font-size: 18px; }
.calc small { color: var(--muted); font-size: 12px; }

/* Bereitschaft, Chips */
.ready { display: flex; align-items: center; gap: 10px; font-size: 17px; }
.ready-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 4px color-mix(in srgb, var(--good) 22%, transparent); }
.ready.warn .ready-dot { background: var(--warn); box-shadow: 0 0 0 4px color-mix(in srgb, var(--warn) 22%, transparent); }
.ready.bad .ready-dot { background: var(--bad); box-shadow: 0 0 0 4px color-mix(in srgb, var(--bad) 22%, transparent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip { font-size: 13px; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); border: 0.5px solid var(--line); }
.chip.good b { color: var(--good); }
.chip.warn b { color: var(--warn); }
.chip.bad b { color: var(--bad); }
.tone-good { color: var(--good); }
.tone-warn { color: var(--warn); }
.tone-bad { color: var(--bad); }
.tone-info { color: var(--info); }

/* Form, Woche, Körper auf der Startseite */
.form-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
.form-nums { display: flex; gap: 18px; }
.form-nums div { display: flex; flex-direction: column; line-height: 1.2; }
.form-nums span { font-size: 12px; }
.form-nums b { font-size: 22px; }
.week-nums { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 10px; }
.week-nums div { display: flex; flex-direction: column; line-height: 1.2; }
.week-nums b { font-size: 18px; }
.week-nums span { font-size: 12px; }
.goal-bar { margin-bottom: 8px; }
.goal-bar small { display: block; margin-top: 4px; }
.body-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.body-row > div { display: flex; flex-direction: column; line-height: 1.25; }
.body-row span { font-size: 13px; }
.big { font-size: 26px; letter-spacing: -0.02em; }
.goals { display: flex; flex-direction: column; gap: 12px; margin-bottom: 10px; }
.goal-top { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; margin-bottom: 4px; font-weight: 560; }
.goal small { display: block; margin-top: 3px; }
.goal-edit { cursor: pointer; }

/* Hinweise */
.insight { display: flex; gap: 12px; padding: 10px 0; border-bottom: 0.5px solid var(--line); }
.insight:last-of-type { border-bottom: 0; }
.insight-mark { width: 4px; border-radius: 2px; flex: none; background: var(--info); }
.insight.good .insight-mark { background: var(--good); }
.insight.warn .insight-mark { background: var(--warn); }
.insight.bad .insight-mark { background: var(--bad); }
.insight-title { font-weight: 620; margin-bottom: 2px; }
.insight p { font-size: 14px; color: var(--muted); margin: 0; }
.insight-action { display: inline-block; font-size: 14px; font-weight: 600; margin-top: 6px; }

/* Kennzahlen */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px 10px; }
.stat { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
.stat-label { font-size: 12px; color: var(--muted); }
.stat-value { font-size: 19px; font-weight: 650; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.stat-sub { font-size: 12px; color: var(--muted); }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.kpis.four { grid-template-columns: repeat(4, 1fr); }
.kpis div { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
.kpis span { font-size: 12px; }
.kpis b { font-size: 18px; }
.kpis small { font-size: 11px; }
.detail-head { padding: 4px 2px; }
.detail-head h2 { font-size: 24px; letter-spacing: -0.02em; margin: 6px 0 2px; }
.detail-head p { font-size: 14px; }
.pill { display: inline-block; font-size: 12px; font-weight: 650; padding: 3px 10px; border-radius: 999px; color: var(--pill); background: color-mix(in srgb, var(--pill) 14%, transparent); }
.best-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.best-grid div { display: flex; flex-direction: column; line-height: 1.2; }
.best-grid span { font-size: 12px; }
.best-grid small { font-size: 11px; }
.best-grid + p, .best-grid + .check-hint, .best-grid ~ .check { margin-top: 12px; }
.split3 { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; margin: 12px 0 8px; background: var(--surface-2); border-radius: 12px; padding: 8px; }
.split3 b { display: block; font-size: 18px; }
.split3 small { color: var(--muted); }

/* Zonen */
.zones { display: flex; flex-direction: column; gap: 7px; }
.zone { display: grid; grid-template-columns: 112px 1fr 44px; align-items: center; gap: 8px; font-size: 13px; }
.zone-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* Leistungsprofil nach Coggan */
.pp-scale { display: flex; justify-content: space-between; margin-top: 4px; }
.pp-row { padding: 10px 0; border-bottom: 1px solid var(--line); }
.pp-row:last-of-type { border-bottom: 0; }
.pp-head, .pp-foot { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.pp-bar { position: relative; display: flex; gap: 2px; height: 8px; margin: 8px 0 6px; }
.pp-bar span { height: 100%; background: var(--track); }
.pp-bar span:first-child { border-radius: 4px 0 0 4px; }
.pp-bar span:last-of-type { border-radius: 0 4px 4px 0; }
.pp-bar span.on { background: color-mix(in srgb, var(--c-pwr) 45%, var(--track)); }
.pp-bar i { position: absolute; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: var(--c-pwr); border: 2px solid var(--surface); box-sizing: border-box; }
.zone-bar { position: relative; height: 10px; background: var(--track); border-radius: 5px; overflow: hidden; }
.zone-bar i { display: block; height: 100%; border-radius: 5px; }
.zone-bar.sets { overflow: visible; }
.zone-bar.sets i { background: var(--accent); }
.zone-bar.sets i.low { background: var(--warn); }
.zone-bar.sets i.high { background: var(--c-lauf); }
.zone-bar.sets b { position: absolute; top: -3px; bottom: -3px; width: 1.5px; background: var(--muted); opacity: .6; }
.zone-val { text-align: right; color: var(--muted); }

/* Diagramme */
.chart { position: relative; margin: 6px 0 4px; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.chart svg { width: 100%; height: auto; overflow: visible; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .grid.zero { stroke: var(--muted); stroke-width: 1; opacity: .7; }
.chart .target { stroke: var(--text); stroke-width: 1.2; stroke-dasharray: 3 4; opacity: .55; }
.chart .cursor { stroke: var(--muted); stroke-width: 1; }
.chart text { fill: var(--muted); font-size: 10px; font-family: inherit; font-variant-numeric: tabular-nums; }
.chart .tip {
  position: absolute; top: 2px; z-index: 5; pointer-events: none;
  background: var(--surface); border: 0.5px solid var(--line); border-radius: 10px; padding: 6px 9px;
  font-size: 12px; line-height: 1.4; box-shadow: 0 4px 16px rgba(0, 0, 0, .12); display: flex; flex-direction: column; min-width: 90px;
}
.chart .tip span { display: flex; align-items: center; gap: 5px; white-space: nowrap; }
.chart .tip i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.chart-empty { color: var(--muted); font-size: 14px; padding: 18px 0; text-align: center; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--muted); margin: 2px 0 10px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 9px; height: 9px; border-radius: 2px; }
.spark { flex: none; }
.track { width: 100%; height: auto; background: var(--surface-2); border-radius: 12px; }

.tbl { width: 100%; border-collapse: collapse; font-size: 14px; margin: 8px 0; }
.tbl th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 550; padding: 4px 0; border-bottom: 0.5px solid var(--line); }
.tbl td { padding: 6px 0; border-bottom: 0.5px solid var(--line); }
.tbl tr:last-child td { border-bottom: 0; }

Ohne Messung sch\xE4tzt die App ihn nach Tanaka: 208 minus 0,7 mal Alter. Die tats\xE4chlichen Werte streuen deutlich um diese Sch\xE4tzung.`,"info.maxhr.q":"Tanaka, Monahan und Seals, Journal of the American College of Cardiology 2001.","info.resthr.t":"Ruhepuls","info.resthr.x":"Dein Puls in v\xF6lliger Ruhe, am besten morgens direkt nach dem Aufwachen gemessen. Ein erh\xF6hter Ruhepuls kann auf Erm\xFCdung, wenig Schlaf oder einen beginnenden Infekt hinweisen.","info.lthr.t":"Laktatschwelle \xFCber Puls","info.lthr.x":`Der Puls bei der h\xF6chsten Anstrengung, die du etwa eine Stunde halten kannst. Nach Friel ist das der Durchschnittspuls der letzten 20 Minuten eines 30 Minuten Zeitfahrens allein.
